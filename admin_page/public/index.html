async function fetchProducts() {
  const res = await fetch("/api/products");
  const data = await res.json();
  originalData = data;
  renderTable(data);
}

function renderTable(data) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";
  data.forEach(product => {
    const preview = product.image_path_list?.[0] ? '/' + product.image_path_list[0].replace(/\\/g, '/') : '';
    const tr = document.createElement("tr");
    tr.classList.add("cursor-pointer", "hover:bg-gray-100", "dark:hover:bg-gray-700", "dark:text-white");
    tr.innerHTML = `
      <td class="text-center"><input type="checkbox" class="selectRow" data-article="${product.article}" value="${product.id}" onclick="event.stopPropagation();" /></td>
      <td class="border px-4 py-2">${product.id}</td>
      <td class="border px-4 py-2">${product.brand}</td>
      <td class="border px-4 py-2">${product.category}</td>
      <td class="border px-4 py-2">${product.article}</td>
      <td class="border px-4 py-2"><img src="${preview}" class="h-16" onerror="this.style.display='none'" /></td>
      <td class="border px-4 py-2 flex gap-2">
        <button onclick="event.stopPropagation(); deleteProduct(${product.id})" class="text-red-600 flex items-center gap-1">
          🗑 Удалить
        </button>
        <button onclick="event.stopPropagation(); sendToTelegram(${product.id})" class="text-blue-600 flex items-center gap-1">
          📤 Telegram
        </button>
        <button onclick="event.stopPropagation(); sendToViber('${product.brand}', '${product.category}', '${product.article}')" class="text-purple-600 flex items-center gap-1">
          📤 Viber
        </button>
      </td>`; // ✅ ← вот тут закрываем шаблонную строку

    tr.addEventListener("click", (event) => {
      const tag = event.target.tagName.toLowerCase();
      if ((tag === 'input' && event.target.type === 'checkbox') || tag === 'button') return;
      openModal(product);
    });
    tbody.appendChild(tr);
  });
}


function applyFilters() {
  const brand = document.getElementById('filterBrand').value.toLowerCase();
  const category = document.getElementById('filterCategory').value.toLowerCase();
  const article = document.getElementById('filterArticle').value.toLowerCase();
  const filtered = originalData.filter(p =>
    p.brand.toLowerCase().includes(brand) &&
    p.category.toLowerCase().includes(category) &&
    p.article.toLowerCase().includes(article)
  );
  renderTable(filtered);
}

function clearFilters() {
  document.getElementById('filterBrand').value = '';
  document.getElementById('filterCategory').value = '';
  document.getElementById('filterArticle').value = '';
  renderTable(originalData);
}

function sortTable(field) {
  sortAscending = currentSortField === field ? !sortAscending : true;
  currentSortField = field;
  const sorted = [...originalData].sort((a, b) => {
    if (a[field] < b[field]) return sortAscending ? -1 : 1;
    if (a[field] > b[field]) return sortAscending ? 1 : -1;
    return 0;
  });
  renderTable(sorted);
}

function openModal(product) {
  currentProduct = product;
  imageList = product.image_path_list.map(p => '/' + p.replace(/\\/g, '/'));
  imageIndex = 0;
  updateModalImage();
  document.getElementById("modalDescription").value = product.description || "";
  document.getElementById("modalSizes").value = product.sizes || "";
  document.getElementById("modalFabric").value = product.fabric || "";
  document.getElementById("modalDelivery").value = product.delivery || "";
  document.getElementById("modal").classList.remove("hidden");
}

function updateModalImage() {
  document.getElementById("modalImage").src = imageList[imageIndex] || '';
}

function prevImage() {
  if (imageList.length > 0) {
    imageIndex = (imageIndex - 1 + imageList.length) % imageList.length;
    updateModalImage();
  }
}

function nextImage() {
  if (imageList.length > 0) {
    imageIndex = (imageIndex + 1) % imageList.length;
    updateModalImage();
  }
}

function closeModal() {
  document.getElementById("modal").classList.add("hidden");
}

async function saveModalEdits() {
  if (!currentProduct) return;

  const updated = {
    id: currentProduct.id,
    description: document.getElementById("modalDescription").value,
    sizes: document.getElementById("modalSizes").value,
    fabric: document.getElementById("modalFabric").value,
    delivery: document.getElementById("modalDelivery").value
  };

  const res = await fetch('/api/products/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(updated)
  });

  if (res.ok) {
    alert("✅ Данные обновлены");
    closeModal();

    // Обновим данные
    await fetchProducts();

    // Найдём обновлённый товар и отправим в Telegram
    const updatedProduct = originalData.find(p => p.id === updated.id);
    if (updatedProduct) {
      sendToTelegram(updatedProduct.id);
    } else {
      alert("⚠️ Не удалось найти обновлённый товар для Telegram");
    }

  } else {
    alert("❌ Ошибка при обновлении");
  }
}


async function addProduct() {
  const brand = document.getElementById("brand").value;
const category = document.getElementById("category").value;
const article = document.getElementById("article").value;
const images = document.getElementById("images").files;
const template = document.getElementById("template").value;

if (!brand || !category || !article || images.length === 0 || !template) {
  return alert("⚠️ Заполните все поля");
}

const subcategory = document.getElementById("template").selectedOptions[0].textContent.split(' ').pop();
const description = template.replace('{{brand}}', brand);

const formData = new FormData();
formData.append("brand", brand);
formData.append("category", category);
formData.append("subcategory", subcategory);
formData.append("article", article);
formData.append("description", description);
formData.append("sizes", "");
formData.append("fabric", "");
formData.append("delivery", "");


  for (const img of images) {
    formData.append("images", img);
  }

  try {
    const response = await fetch("/api/products", {
      method: "POST",
      body: formData
    });

    if (response.ok) {
      alert("✅ Товар успешно добавлен!");
      document.getElementById("brand").value = '';
      document.getElementById("category").value = '';
      document.getElementById("article").value = '';
      document.getElementById("images").value = '';
      document.getElementById("template").innerHTML = '';
      fetchProducts();

      // Telegram публикация
      const fileArray = Array.from(images);
      const media = fileArray.map((file, i) => ({
        type: 'photo',
        media: `attach://file${i}`,
        ...(i === 0 && { caption: description })
      }));

      const sendForm = new FormData();
      sendForm.append('chat_id', CHAT_ID);
      sendForm.append('media', JSON.stringify(media));
      fileArray.forEach((file, i) => {
        sendForm.append(`file${i}`, file, file.name);
      });

      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup`, {
        method: 'POST',
        body: sendForm
      });
    } else {
      alert("❌ Ошибка при добавлении");
    }
  } catch (err) {
    console.error("Ошибка:", err);
    alert("🚫 Ошибка отправки на сервер");
  }
}

async function deleteProduct(id) {
  await fetch(`/api/products/${id}`, { method: "DELETE" });
  fetchProducts();
}

async function deleteSelected() {
  const selected = [...document.querySelectorAll(".selectRow:checked")];
  const articles = new Set(selected.map(row => row.dataset.article));
  if (articles.size === 0) return alert("Ничего не выбрано");

  for (const article of articles) {
    const res = await fetch(`/api/products/deleteByArticle/${article}`, {
      method: "DELETE"
    });
    if (!res.ok) console.warn(`Ошибка удаления ${article}`);
  }

  fetchProducts();
}

function updateTemplateOptions() {
  const cat = document.getElementById("category").value;
  const templateSelect = document.getElementById("template");
  templateSelect.innerHTML = "";

  if (templates[cat]) {
    Object.entries(templates[cat]).forEach(([size, text]) => {
      const option = document.createElement("option");
      option.value = text;
      option.textContent = `${cat} ${size}`;
      templateSelect.appendChild(option);
    });
  }
}

  const description = product.description || '';
  const images = product.image_path_list || [];

  if (!images.length) return alert("⚠️ Нет фото для отправки");

  // 1. Загружаем текущий serverBaseUrl из /api/base-url
  let serverBaseUrl = '';
  try {
    const res = await fetch('/api/base-url');
    const data = await res.json();
    serverBaseUrl = data.baseUrl.endsWith('/') ? data.baseUrl : data.baseUrl + '/';
    console.log("✅ Ссылка ngrok:", serverBaseUrl);
  } catch (e) {
    console.error("❌ Не удалось получить ngrok-ссылку:", e);
    return alert("❌ Не удалось получить ссылку сервера");
  }

  // 2. Формируем медиа-объекты
  const media = images.map((path, index) => ({
    type: 'photo',
    media: serverBaseUrl + path.replace(/\\/g, '/'),
    ...(index === 0 && { caption: description })
  }));

  // 3. Отправляем альбом в Telegram
  try {
    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMediaGroup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: CHAT_ID, media })
    });

    const result = await res.json();
    if (result.ok) {
      alert("✅ Товар отправлен в Telegram!");
    } else {
      console.error(result);
      alert("❌ Ошибка Telegram:\n" + JSON.stringify(result));
    }
  } catch (err) {
    console.error(err);
    alert("🚫 Ошибка отправки в Telegram");
  }
}

function sendToViber(brand, category, article) {
  const product = originalData.find(p =>
    p.brand === brand && p.category === category && p.article === article
  );
  if (!product) return alert("❌ Товар не найден");

  const folder = `images/${brand}/${category}/${article}`;
  const encodedPath = encodeURIComponent(folder);
  const encodedDesc = encodeURIComponent(product.description || '');

  fetch(`/run-viber-script?folder=${encodedPath}&description=${encodedDesc}`)
    .then(res => res.json())
    .then(data => {
      if (data.success) {
        alert('✅ Скрипт отправки в Viber запущен');
      } else {
        alert('❌ Ошибка запуска: ' + data.message);
      }
    })
    .catch(err => {
      console.error(err);
      alert('🚫 Не удалось запустить Viber скрипт');
    });
}
